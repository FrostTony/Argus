openapi: 3.1.0

# The HTTP surface of one argus node. Kept here as a file rather than served by
# the node: an agent's job is to probe, and a spec it hands out is one more
# endpoint to authorise, cache and keep from drifting. Point Swagger UI,
# Postman or a code generator at this file.
#
#   docker run -p 8080:8080 -e SWAGGER_JSON=/spec/swagger.yaml \
#     -v "$PWD/docs:/spec" swaggerapi/swagger-ui

info:
  title: Argus
  version: "0.0.2"
  summary: Active monitoring for domains.
  description: |
    A node probes the targets in its configuration and exposes what it found.
    Everything under `/api` exists to run and change those checks from outside;
    everything else is what a scraper or a person reads.

    **Permissions.** Reading and writing are separate, and each is configured on
    its own (`http.api.read_auth` / `write_auth`, either `token` or `none`).
    A read token never authorises a change: handing a dashboard the operator's
    token would be handing it the power to repoint the node. `/metrics` and the
    status pages carry no token at all — they hold no secrets, and a scraper has
    none to offer.

    **The API is off by default.** It appears only with `http.api.enabled: true`.
    Without it every path below `/api` is a 404.

    **The API is for clients, not web pages.** A request a browser marks as
    cross-site — an `Origin` of another host, `Sec-Fetch-Site: cross-site` or
    `same-site` — is answered 403 on every `/api` path and `/probe`, whatever
    token it carries. With `write_auth: none`, a write is taken only when the
    `Host` is an IP address or `localhost`: a page that rebinds its own name to
    the node sends that name. A token left as an unset `${VAR}` stops the node
    at start.

servers:
  - url: http://{host}:{port}
    variables:
      host: {default: localhost}
      port: {default: "6767"}

tags:
  - name: exposition
    description: What a scraper reads. No authentication.
  - name: status
    description: What a person reads. No authentication.
  - name: config
    description: The check configuration. Read and write are separate rights.
  - name: checks
    description: Running a check now, rather than at its interval.
  - name: scenarios
    description: |
      Multi-step checks that act on a service the way a user does, read from
      the files under `scenarios.paths`. Each changes the target and runs for
      minutes, so none runs inside a request.

paths:
  /metrics:
    get:
      tags: [exposition]
      summary: Prometheus exposition
      description: |
        Every series the node currently holds, in the text exposition format.
        The path is `http.metrics_path` and can be moved. The paths the node
        already serves — the status pages, `/healthz` and those under `/api` —
        are refused as a value for it, because registering a handler twice is a
        crash at startup for what is only a typo.

        Series older than `probing.stale_after` are not exposed: a node that
        fans out across addresses that change on their own would otherwise
        report yesterday's backend as down forever.
      security: []
      responses:
        "200":
          description: The exposition.
          content:
            text/plain:
              schema: {type: string}
              example: |
                # HELP argus_probe_up Whether the last probe of this backend succeeded.
                # TYPE argus_probe_up gauge
                argus_probe_up{backend="142.250.74.46:443",probe="web",target="https://www.google.com/"} 1

  /healthz:
    get:
      tags: [exposition]
      summary: Liveness
      description: Answers as soon as the listener is up. It says nothing about the targets.
      security: []
      responses:
        "200":
          description: The node is serving.
          content:
            text/plain:
              schema: {type: string}
              example: "ok\n"

  /:
    get:
      tags: [status]
      summary: Status page
      description: |
        A single self-contained page: what every probe found on its last run,
        with per-backend charts. The node keeps no history, so the trends are
        built in the browser from the snapshots below and die with the tab.
        Also served at `/status`.
      security: []
      responses:
        "200":
          description: The page.
          content:
            text/html:
              schema: {type: string}

  /status:
    get:
      tags: [status]
      summary: Status page
      description: The same page as `/`.
      security: []
      responses:
        "200":
          description: The page.
          content:
            text/html:
              schema: {type: string}

  /logo.png:
    get:
      tags: [status]
      summary: The mark the status page wears
      description: |
        Carried in the binary, so a node in a closed network renders the same as
        one with a route to the internet. Served beside the page rather than
        inlined into it, so a browser fetches it once for a page that is meant
        to be reloaded often.
      security: []
      responses:
        "200":
          description: A PNG, about ten kilobytes.
          content:
            image/png:
              schema: {type: string, format: binary}
        "304":
          description: Unchanged since the client last asked.

  /status/data:
    get:
      tags: [status]
      summary: What the page polls
      description: |
        Every metric the last run recorded, grouped the way a person reads it:
        probe, target, backend. A fresh snapshot each time — nothing about the
        previous answer is remembered here.
      security: []
      responses:
        "200":
          description: The current state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StateView"}

  /status.json:
    get:
      tags: [status]
      summary: What the node checks
      description: |
        The configuration as the node has it, after defaults, templates and
        discovery — not the metrics. This is the endpoint a controller polls to
        see whether a node picked up what it was given.
      security: []
      responses:
        "200":
          description: The node's own summary.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Status"}

  /probe:
    get:
      tags: [checks]
      summary: Check one target and answer with a Prometheus exposition
      description: |
        The other way round: Prometheus names the target and gets
        the measurements back, so the list of targets lives in its service
        discovery rather than in this node's configuration. Nothing is stored,
        exactly as for `/api/check`.

        Alongside the probe's own metrics it returns `probe_success`, one series
        per target. `probe_up` cannot answer "did the check pass": it is per
        backend, and a target that stopped resolving has none at all, so an
        alert written over it quietly stops firing at the worst moment.

        Series carry no prefix by default, so `probe_success`,
        `probe_duration_seconds` and `probe_up` are the names a blackbox
        dashboard already uses. Alongside them, unless
        `http.api.probe_aliases` is false, the endpoint publishes
        blackbox_exporter's names for the series both tools measure the same
        way — `probe_http_status_code`, `probe_ssl_earliest_cert_expiry`,
        `probe_dns_lookup_time_seconds`, `probe_ip_protocol` and the rest.
        Only exact twins are translated: a familiar name over a different
        measurement is worse than no series at all.

        No histograms: one run is not a distribution, and a histogram scraped
        here has a count of one and never moves. The `*_last_duration_seconds`
        gauge beside it carries the measurement.

        **Permission.** The same rule as `/api/check`: a configured probe run as
        configured is a read; naming `target` or `hostname` is a write, because
        both send this node somewhere the configuration did not say to send it,
        carrying whatever credentials the probe holds. `debug` is a write too:
        the trace carries what the target answered and what was asked of it. A
        scrape config supplies the token with `authorization`.

        Served only when `http.api.probe_endpoint` is true, which is the
        default. Turned off, the path is not mounted at all.
      security: [{readToken: []}]
      parameters:
        - name: probe
          in: query
          required: false
          description: The configured probe to run. `module` is accepted as an alias.
          schema: {type: string}
          example: web
        - name: module
          in: query
          required: false
          description: An alias for `probe`, so an existing scrape config needs no rewriting.
          schema: {type: string}
        - name: target
          in: query
          required: false
          description: Check this target instead of the probe's own. Supplying it makes the request a write.
          schema: {type: string}
          example: https://www.google.com/
        - name: hostname
          in: query
          required: false
          description: |
            Present this name to the target — Host header and SNI — without
            changing the address connected to, which is how one virtual host is
            checked on a machine that serves many. Supplying it makes the
            request a write.
          schema: {type: string}
          example: canary.example.com
        - name: debug
          in: query
          required: false
          description: |
            Prepend the run's trace as comment lines. The answer is still a
            valid exposition, so a scrape is unaffected and whoever is holding
            curl gets the log. Supplying it makes the request a write.
          schema: {type: boolean, default: false}
      responses:
        "200":
          description: |
            The check ran. A target that is down is a successful answer to the
            question asked, so the status describes the request and
            `probe_success` describes the target.
          content:
            text/plain:
              schema: {type: string}
              example: |
                # HELP probe_success Whether the on-demand check of this target passed.
                # TYPE probe_success gauge
                probe_success{probe="web",target="https://www.google.com/"} 1
        "400":
          description: No such probe, or the request did not describe a check.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}

  /api/config:
    get:
      tags: [config]
      summary: Read the check configuration
      description: |
        The configuration as accepted, byte for byte: comments, templates and
        defaults are still there and `${VAR}` references are not expanded, so a
        read token sees no secret taken from the environment and what comes back
        can be sent straight back in. A node started from several files answers
        a YAML stream with one document per file, which `PUT` refuses: such a
        configuration is edited on disk. Empty when there is none yet.

        **Credentials are for the write token.** A read token gets the document
        with them masked: values under keys such as `password`, `token`,
        `secret`, `api_key`, `authorization`, `cookie`, and the password of any
        URL become `<redacted>`; a value that is only `${VAR}` references stays.
      security: [{readToken: []}]
      responses:
        "200":
          description: The configuration, in YAML.
          content:
            application/yaml:
              schema: {type: string}
              example: |
                defaults: {interval: 30s}
                probes:
                  - name: web
                    type: http
                    targets: ["https://www.google.com/"]
                    http: {}
        "401": {$ref: "#/components/responses/Unauthorized"}
    put:
      tags: [config]
      summary: Replace the check configuration
      description: |
        Parsed exactly as a file is — an unknown field is an error, not a probe
        that runs happily while checking the wrong thing, and `${VAR}` is
        expanded — then applied, then written back to the file the node started
        from. What is written is the request body as it arrived: comments and
        `${VAR}` references survive, and a secret taken from the environment
        does not reach the disk.

        The order matters. Building the probes is the rest of the validation, so
        a configuration this node cannot run never reaches the file; and a change
        that cannot be written is refused outright, because applying it in memory
        alone is how a node and its files drift apart.

        Writing needs a single destination: `PUT` replaces the whole
        configuration, and putting that back into a directory would mean deciding
        which of the files already there to delete. A node started with
        `-probes <dir>` or several paths answers 409 and says so in its log at
        startup.

        Probes whose definition did not change keep running, with their tickers
        untouched: a node reloaded often must not stampede its targets.

        `POST` does the same thing.
      security: [{writeToken: []}]
      requestBody:
        required: true
        content:
          application/yaml:
            schema: {type: string}
            example: |
              probes:
                - name: web
                  type: http
                  targets: ["https://www.google.com/"]
                  http: {}
      responses:
        "200":
          description: Applied and written. The body is the node's new state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Status"}
        "400":
          description: |
            The configuration was refused and nothing changed — a syntax error,
            an unknown field, a probe type this build does not have, a timeout
            longer than its interval. The running checks are untouched.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409":
          description: |
            This node has no single check file to write to, so the change was
            not applied at all.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
              example:
                error: >-
                  this node has no single check file to write to, so a change
                  through the API would not survive a restart; edit the file and
                  reload instead
        "500":
          description: |
            Applied but not saved. The node is running this configuration and the
            file still holds the previous one, so a restart will undo it. The
            message says so rather than leaving the operator to guess which of
            the two is live.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
    post:
      tags: [config]
      summary: Replace the check configuration
      description: The same as `PUT`.
      security: [{writeToken: []}]
      requestBody:
        required: true
        content:
          application/yaml:
            schema: {type: string}
      responses:
        "200":
          description: Applied and written.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Status"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409":
          description: No single check file to write to.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500":
          description: Applied but not saved.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /api/reload:
    post:
      tags: [config]
      summary: Re-read the configuration files
      description: |
        What SIGHUP does. The files the node was started with are read again, so
        an edit made on disk takes effect without a restart. Probes that did not
        change keep running.
      security: [{writeToken: []}]
      responses:
        "200":
          description: Reloaded. The body is the node's new state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Status"}
        "400":
          description: |
            The files were refused, or the node was started with none. Nothing
            changed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}

  /api/probes:
    post:
      tags: [checks]
      summary: Run a probe now
      description: |
        Runs one probe — or every probe, with no `name` — without waiting for its
        interval, and records the result like any other run. This is how a deploy
        verifies a new check.

        Every probe means every probe and no scenario: a scenario changes the
        target and runs for longer than a request lasts. Naming one is a 400
        pointing at `POST /api/scenarios/{name}/run`.

        Unlike `/api/check`, this one writes to the store: it is a real run,
        brought forward.
      security: [{writeToken: []}]
      parameters:
        - name: name
          in: query
          required: false
          description: The probe to run. Omitted, every probe runs.
          schema: {type: string}
          example: web
      responses:
        "200":
          description: The run finished.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ran: {type: string, description: The probe that ran, or "all".}
                required: [ran]
              example: {ran: web}
        "400":
          description: The name is a scenario's.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404":
          description: No probe of that name is configured on this node.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: |
            That probe is already running. Two runs of one probe would report
            each other's results, so the second is refused rather than queued.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}

  /api/check:
    get:
      tags: [checks]
      summary: Check something once, storing nothing
      description: |
        Ask a question and read the answer inline. Nothing reaches the store: a
        one-off check run by a person debugging a target must not leave a series
        behind that a dashboard then treats as monitoring data.

        **The permission depends on what is asked.** Running a configured probe
        exactly as configured is a read. Pointing it at another address
        (`target`) is a write, because it sends that probe's configured
        credentials somewhere the caller chose.
      security: [{readToken: []}]
      parameters:
        - {$ref: "#/components/parameters/CheckProbe"}
        - {$ref: "#/components/parameters/CheckTarget"}
        - {$ref: "#/components/parameters/CheckHostname"}
        - {$ref: "#/components/parameters/CheckDebug"}
        - {$ref: "#/components/parameters/CheckCapture"}
      responses:
        "200":
          description: |
            The check ran. A target that is down is a successful answer to the
            question that was asked, so the status describes the API call and
            `success` describes the target.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CheckResult"}
        "400":
          description: No such probe, or the request did not describe a check.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
    post:
      tags: [checks]
      summary: Check a probe definition that is not in the configuration
      description: |
        The body is a probe definition, parsed as strictly as one in a file. This
        is always a write: a definition can name the `external` prober, which
        runs a command on this node.

        With an empty body this behaves exactly like `GET`.
      security: [{writeToken: []}]
      parameters:
        - {$ref: "#/components/parameters/CheckProbe"}
        - {$ref: "#/components/parameters/CheckTarget"}
        - {$ref: "#/components/parameters/CheckHostname"}
        - {$ref: "#/components/parameters/CheckDebug"}
        - {$ref: "#/components/parameters/CheckCapture"}
      requestBody:
        required: false
        content:
          application/yaml:
            schema: {type: string}
            example: |
              name: ad-hoc
              type: http
              targets: ["https://www.google.com/"]
              http:
                validators:
                  - {name: status, status: "200-399"}
      responses:
        "200":
          description: The check ran.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CheckResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    put:
      tags: [checks]
      summary: Check a probe definition that is not in the configuration
      description: The same as `POST`.
      security: [{writeToken: []}]
      parameters:
        - {$ref: "#/components/parameters/CheckProbe"}
        - {$ref: "#/components/parameters/CheckTarget"}
        - {$ref: "#/components/parameters/CheckHostname"}
        - {$ref: "#/components/parameters/CheckDebug"}
        - {$ref: "#/components/parameters/CheckCapture"}
      requestBody:
        required: false
        content:
          application/yaml:
            schema: {type: string}
      responses:
        "200":
          description: The check ran.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CheckResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/scenarios:
    get:
      tags: [scenarios]
      summary: The scenarios this node runs
      description: |
        Every scenario that runs on this node — a disabled one, or one whose
        `run_on` names other nodes, is not here — with its steps and how its
        last run against each target went.
      security: [{readToken: []}]
      responses:
        "200":
          description: The scenarios, in configuration order.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Scenario"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}

  /api/scenarios/{name}:
    get:
      tags: [scenarios]
      summary: One scenario, step by step
      description: |
        A scenario fails at a step, and which step is the first question. The
        last run against each target lists every step — the ones a failure kept
        from running as `not_run` — with its status code, attempts, duration and
        error. Secrets appear as their reference; extracted values not at all.
      security: [{readToken: []}]
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}, example: video-pipeline}
      responses:
        "200":
          description: The scenario.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Scenario"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404":
          description: No scenario of that name runs on this node.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}

  /api/scenarios/{name}/run:
    post:
      tags: [scenarios]
      summary: Start a scenario now
      description: |
        Starts a run off the schedule and answers at once: a run takes minutes,
        longer than a request may last. The outcome goes where a scheduled run's
        does — the metrics, and `GET /api/scenarios/{name}` once `running` is
        false again. A write, logged with the caller: the run changes the target.
      security: [{writeToken: []}]
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}, example: video-pipeline}
      responses:
        "202":
          description: The run has started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  started: {type: string}
                  status: {type: string, description: Where to read the outcome.}
                required: [started, status]
              example: {started: video-pipeline, status: /api/scenarios/video-pipeline}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404":
          description: No scenario of that name runs on this node.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "409":
          description: |
            A run is in progress — scheduled, started here, or the last run of a
            scenario a reload replaced, still cleaning up.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503":
          description: The node is starting or shutting down.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

components:
  securitySchemes:
    readToken:
      type: http
      scheme: bearer
      description: |
        `http.api.read_token`, or `http.api.token` when no read token is set.
        Not required when `read_auth: none`.
    writeToken:
      type: http
      scheme: bearer
      description: |
        `http.api.token`. A read token is never accepted here. Not required when
        `write_auth: none`, which the node warns about at startup.

  parameters:
    CheckProbe:
      name: probe
      in: query
      required: false
      description: A configured probe to run. Leave it out when the body carries a definition.
      schema: {type: string}
      example: web
    CheckTarget:
      name: target
      in: query
      required: false
      description: |
        Check this one target instead of the probe's own. Supplying it makes the
        request a write.
      schema: {type: string}
      example: https://staging.google.com/
    CheckHostname:
      name: hostname
      in: query
      required: false
      description: |
        Present this name to the target — Host header and SNI — without changing
        the address connected to. Supplying it makes the request a write.
      schema: {type: string}
      example: canary.example.com
    CheckDebug:
      name: debug
      in: query
      required: false
      description: |
        Return the run's log alongside the result. The log carries what the
        target answered, so supplying it makes the request a write.
      schema: {type: boolean, default: false}
    CheckCapture:
      name: capture
      in: query
      required: false
      description: |
        Return what each backend answered, as `artifacts` beside its metrics:
        the page that explains a failure the numbers only report — a block
        page, a WAF challenge, a parked domain. Today the `http` prober
        answers it, with the exchange (every redirect hop, response headers
        only) and the body as served, up to `max_body_bytes`. Probers that
        have nothing to show ignore it.

        It is for one target: every answer is held until the reply is
        written, so a probe with several targets needs `target`. Supplying it
        makes the request a write — it returns what the target answered.

        **What it may read** is the node's `http.api.capture`: `public` (the
        default) connects only to public addresses — never loopback,
        link-local (where cloud metadata lives), private, carrier-grade NAT or
        reserved space. The address is vetted on every connection, after
        resolution, so a redirect, a proxy or a name that resolves elsewhere
        the second time cannot carry the capture inward. `all` lifts that;
        `off` refuses capture with 400.

        A body stops at `max_body_bytes` or 2 MiB, whichever is less, and the
        exchange at 64 KiB; `truncated` says so. The answer is compact JSON.
      schema: {type: boolean, default: false}

  responses:
    Unauthorized:
      description: The token is missing or does not grant this action.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          example: {error: unauthorized}
    BadRequest:
      description: The request was refused and nothing changed.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    MethodNotAllowed:
      description: Wrong method for this path.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: |
            What went wrong, in a sentence. Failures name the thing that failed —
            the field, the probe, the file — because the next step after reading
            this is fixing it.
      required: [error]

    Status:
      type: object
      description: What the node currently checks. No metrics.
      properties:
        node: {type: string, description: This node's name, which every series carries as a label.}
        version: {type: string, example: 0.0.2, description: The release this node runs, for a deploy to gate on.}
        uptime: {type: string, example: 3h12m4s}
        series: {type: integer, description: Series held in the metric store.}
        config_source:
          type: string
          enum: [file, api, none]
          description: >
            Where the running checks came from. "none" is a node nobody has
            pushed to yet: it checks nothing and says so.
        config_hash:
          type: string
          description: >
            sha256 of the bytes the configuration was accepted as. Whoever
            pushes can compute the same value and skip a push that would change
            nothing. A configuration read from files hashes over their names and
            contents instead, so it never matches a pushed document.
        config_applied_at: {type: string, format: date-time}
        resolver: {type: string, enum: [system, custom]}
        probes:
          type: array
          items: {$ref: "#/components/schemas/ProbeStatus"}
      required: [node, version, uptime, series, config_source, resolver, probes]

    ProbeStatus:
      type: object
      description: One probe as the node has it, after defaults, templates and discovery.
      properties:
        name: {type: string}
        type: {type: string, example: http}
        interval: {type: string, example: 30s}
        timeout: {type: string, example: 5s}
        per_backend:
          type: boolean
          description: Whether every resolved address is checked separately.
        sleeping:
          type: boolean
          description: Whether the probe's schedule has it paused right now.
        negative:
          type: boolean
          description: |
            The probe passes when the check fails — a blocklist, a WAF rule, a
            decommissioned endpoint. A green row here does not mean the endpoint
            answers.
        failures:
          type: object
          additionalProperties: {type: string}
          description: |
            `"target|backend"` to the message behind a current failure.
            "connect" is a category; this is the sentence a person needs.
          example:
            "https://www.google.com/|142.250.74.46:443": "status: got 503, want 200-399"
        targets:
          type: array
          items: {type: string}
      required: [name, type, interval, timeout, per_backend, targets]

    StateView:
      type: object
      description: |
        Everything the node knows right now, and nothing it knew before. The
        history behind the page's charts lives in the browser tab.
      properties:
        node: {type: string}
        version: {type: string}
        uptime: {type: string}
        stale_after:
          type: string
          description: How long a series survives without being written again.
        time: {type: integer, description: Unix milliseconds this snapshot was taken.}
        up: {type: integer, description: Backends that answered.}
        down: {type: integer, description: Backends that did not.}
        series: {type: integer}
        probes:
          type: array
          items: {$ref: "#/components/schemas/ProbeState"}
      required: [node, version, uptime, stale_after, time, up, down, series, probes]

    ProbeState:
      type: object
      properties:
        name: {type: string}
        type: {type: string}
        interval: {type: string}
        sleeping: {type: boolean}
        negative: {type: boolean}
        targets:
          type: array
          items: {$ref: "#/components/schemas/TargetState"}
      required: [name, type, interval, targets]

    TargetState:
      type: object
      properties:
        target: {type: string}
        up: {type: integer}
        total: {type: integer}
        resolve: {type: number, description: Seconds the name took, apart from the request.}
        error:
          type: string
          description: |
            Set when the target never got as far as a backend, which in practice
            means it stopped resolving.
        stats:
          type: object
          additionalProperties: {type: number}
          description: The metrics that belong to the target rather than to one of its addresses.
        backends:
          type: array
          items: {$ref: "#/components/schemas/BackendState"}
      required: [target, up, total, backends]

    BackendState:
      type: object
      description: Every metric the probe recorded for one address, split by how it is read.
      properties:
        backend: {type: string, example: "93.184.216.34:443"}
        family: {type: string, enum: [ipv4, ipv6]}
        up: {type: boolean}
        reason:
          type: string
          description: Which stage broke.
          enum: [dns, connect, tls, timeout, protocol, status, content, internal, unknown]
        error:
          type: string
          description: What actually happened, which is what the page was opened to find out.
        latency: {type: number, description: Seconds the last probe took.}
        age: {type: number, description: Days until the leaf certificate expires, where there is one.}
        phases:
          type: object
          additionalProperties: {type: number}
          example: {connect: 0.012, tls: 0.031, ttfb: 0.08, transfer: 0.004}
        gauges:
          type: object
          additionalProperties: {type: number}
        counters:
          type: object
          additionalProperties: {type: number}
        info:
          type: object
          additionalProperties: {type: string}
        hist:
          type: object
          additionalProperties: {$ref: "#/components/schemas/Histogram"}
      required: [up]

    Histogram:
      type: object
      description: A distribution without its buckets — enough to read, small enough to poll.
      properties:
        count: {type: integer}
        mean: {type: number}
        p50: {type: number}
        p95: {type: number}
      required: [count, mean, p50, p95]

    CheckResult:
      type: object
      description: One ad-hoc check. Nothing here reached the store.
      properties:
        probe: {type: string}
        type: {type: string}
        duration: {type: string, example: 142ms}
        success: {type: boolean}
        targets:
          type: array
          items: {$ref: "#/components/schemas/TargetCheck"}
        log:
          type: array
          items: {type: string}
          description: |
            The run's trace, with `debug=true`. The single most useful thing when
            a check fails for a reason the metrics do not explain.
      required: [probe, type, duration, success, targets]

    TargetCheck:
      type: object
      properties:
        target: {type: string}
        resolve_seconds: {type: number}
        backends_up: {type: integer}
        backends_total: {type: integer}
        error: {type: string}
        backends:
          type: array
          items: {$ref: "#/components/schemas/BackendCheck"}
      required: [target, backends_up, backends_total, backends]

    BackendCheck:
      type: object
      properties:
        backend: {type: string}
        family: {type: string, enum: [ipv4, ipv6]}
        success: {type: boolean}
        reason:
          type: string
          enum: [dns, connect, tls, timeout, protocol, status, content, internal, unknown]
        error: {type: string}
        phases:
          type: object
          additionalProperties: {type: number}
        metrics:
          type: object
          additionalProperties: true
          description: What the probe measured, returned inline instead of being stored.
        artifacts:
          type: array
          items: {$ref: "#/components/schemas/Artifact"}
          description: What this backend answered, with `capture=true`.
      required: [success]

    Artifact:
      type: object
      description: Something the target answered, handed back as it came. The node keeps none of it.
      properties:
        name:
          type: string
          description: "`headers` — the exchange as text, redirects first; `body` — the response body."
          example: body
        media_type:
          type: string
          description: As the server declared it, charset included; guessed only when it declared none.
          example: text/html; charset=windows-1251
        url:
          type: string
          description: Where it came from, which a redirect may have moved off the target.
        data:
          type: string
          format: byte
          description: |
            Base64 of the bytes as served, undecoded: a page in windows-1251 is
            bytes, and the charset in `media_type` says how to read them.
        truncated:
          type: boolean
          description: The answer went on past a limit — `max_body_bytes`, 2 MiB for a body, 64 KiB for the exchange — and `data` stops there.
      required: [name, data]

    Scenario:
      type: object
      properties:
        name: {type: string, example: video-pipeline}
        interval: {type: string, example: 15m0s}
        timeout: {type: string, example: 8m0s}
        targets:
          type: array
          items: {type: string}
        running: {type: boolean, description: Whether a run is in progress now.}
        steps:
          type: array
          items: {type: string}
          example: [login, list, upload, convert, playback, comment]
        cleanup:
          type: array
          items: {type: string}
        last_runs:
          type: array
          items: {$ref: "#/components/schemas/ScenarioRun"}
      required: [name, interval, timeout, targets, running, steps, last_runs]

    ScenarioRun:
      type: object
      description: The last run against one target.
      properties:
        target: {type: string}
        started: {type: string, format: date-time}
        duration_seconds: {type: number}
        success: {type: boolean, description: Whether every step passed. Cleanup does not count.}
        error: {type: string, example: "step convert: abort_if held: {\"status\": \"failed\"}"}
        steps:
          type: array
          items: {$ref: "#/components/schemas/ScenarioStep"}
        cleanup:
          type: array
          items: {$ref: "#/components/schemas/ScenarioStep"}
      required: [target, started, duration_seconds, success, steps]

    ScenarioStep:
      type: object
      properties:
        name: {type: string}
        status:
          type: string
          enum: [passed, failed, skipped, not_run]
          description: |
            `skipped` is a cleanup step that needed a variable no step got as
            far as setting; `not_run` is a step a failure kept from running.
        http_status: {type: integer}
        attempts: {type: integer, description: Requests a waiting step made.}
        duration_seconds: {type: number}
        error: {type: string}
      required: [name, status, duration_seconds]
